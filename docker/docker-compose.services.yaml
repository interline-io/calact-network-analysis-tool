# Backing test services (postgres + tlserver), used locally and in CI:
#   docker compose -f docker-compose.services.yaml up
#
# tlserver restores the dumps in its entrypoint BEFORE binding its port, so
# readiness is intrinsic and needs no `-init` service or completion gate.
#
# The image is built locally, never published — a cold build is ~30s, cheaper
# than a registry and its staleness failure modes.
#
# Ports are offset into the 2xxxx range so this stack can run alongside a manual
# testdata/gtfs/restore.sh server on 8080.
name: calact
services:
  postgres:
    image: imresamu/postgis:16-3.5-alpine
    environment:
      POSTGRES_DB: calact
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "25432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  tlserver:
    image: calact-tlserver:latest
    build:
      context: ./tlserver
      dockerfile: tlserver.docker
    entrypoint: ["/bin/bash", "/tlserver/entrypoint.sh"]
    volumes:
      - ../testdata/gtfs/calact_tlserver.dump:/data/calact_tlserver.dump:ro
      - ../testdata/gtfs/calact_tlserver-census.dump:/data/calact_tlserver-census.dump:ro
      - ./tlserver/entrypoint.sh:/tlserver/entrypoint.sh:ro
      - ./tlserver/test-init.sh:/tlserver/test-init.sh:ro
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: calact_tlserver
      TL_LOG: info
    ports:
      - "28080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  db:
